name: trident tests

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-unit-tests:
    name: Fast Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Runtime libvips only: pyvips loads it without headers, and OpenSlide comes from the
      # openslide-bin wheel.
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools

      # CI runners have no GPU: install CPU-only torch first so `pip install -e .` does not
      # pull the CUDA wheels (about 3 GB).
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Run fast unit tests only
        env:
          TRIDENT_RUN_INTEGRATION_TESTS: "0"
          TRIDENT_RUN_GPU_TESTS: "0"
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v